<!DOCTYPE html>
<html>
  <head>
    <title>Submit new recipe</title>
  </head>
  <body>
    <h1>New Recipe Submission Test</h1>
    <button id="submitRecipeButton">Submit Recipe Revision to Server</button>
    <h2>Submitting the following as a recipe:</h2>
    <p id="jsonSubmission"></p>
    <h2>The server has stored the following new recipe:</h2>
    <p id="jsonSubmissionResult"></p>
    <!-- Placed here so that it sees everything. -->
    <script defer="defer">
      // This builds the JSON to send to the server.
      // We use a hardcoded value for testing purposes.
      const outval = {
        // ID is correct if the recipe was created through prefilled data
        id: 3,
        title: "Weekend Pancakes",
        servings: 4,
        // We will be changing visibility to public to test making this revision public
        visibility: "public",
        ingredients: [
            // The difference is that flour is 2 instead of 1.
            { name: "flour", count: 2, unit: "cup" },
            { name: "milk", count: 1, unit: "cup" },
            { name: "eggs", count: 1, unit: null }
        ],
        instructions:
            "Mix the ingredients.\n" +
            "Pour small portions onto a warm skillet.\n" +
            "Cook both sides until done.",
      };
      const outJson = JSON.stringify(outval);
      const submittedInput = document.getElementById("jsonSubmission");
      const submissionOutput = document.getElementById("jsonSubmissionResult");
      const submitButton = document.getElementById("submitRecipeButton");
      // Will be a Promise, then the actual value.
      let serverResponse = null;
      // Since srvCreateNewRecipe() returns the parsed results of the JSON, we regenerate the JSON for display purposes.
      let serverResponseJson = null;
      /**
       * Validates a recipe before submitting it.
       */
      function validateRecipeSubmissionData(recipeData, hasId = false) {
          let is_valid = true;
          // The immediate descendants of the object
          let layer_1_is_valid = (hasId === true? Number.isInteger(recipeData.id) : true) &&
                                 typeof recipeData.title === "string" &&
                                 typeof recipeData.instructions === "string" &&
                                 Array.isArray(recipeData.ingredients) &&
                                 Number.isInteger(recipeData.servings) &&
                                 recipeData.servings >= 1 &&
                                 recipeData.servings <= 1000 &&
                                 ["public", "private"].includes(recipeData.visibility);
          let layer_2_is_valid = true;
          if (layer_1_is_valid) {
              // The next layer down (just the ingredients list)
              recipeData.ingredients.forEach(function (ingrItem, ind, arr) {
                  layer_2_is_valid = (layer_2_is_valid &&
                                      typeof ingrItem.name === "string" &&
                                      Number.isInteger(ingrItem.count) &&
                                      (typeof ingrItem.unit === "string" ||
                                       ingrItem.unit === null));
              });
              if (!layer_2_is_valid) {
                  is_valid = false;
              }
          } else {
              is_valid = false;
          }
          return is_valid;
      }
      /**
       * Submits a new recipe revision to the server.
       * It will send back its JSON representation of the recipe.
       */
      async function srvUpdateRecipe(recipeData) {
          let is_valid = validateRecipeSubmissionData(recipeData, true);
          // Send data to server
          if (!is_valid) {
              console.error("Recipe data failed validation");
              return;
          }
          // Needs to reference ../ because we are in a subdirectory.
          const CNR_API_ENDPOINT = "../api/update-recipe/";
          const cnrHeaders = new Headers();
          cnrHeaders.append("Content-Type", "application/json; charset=utf-8");
          const CNR_FETCH_OPTIONS = {
              method: "POST",
              headers: cnrHeaders,
              body: JSON.stringify(recipeData),
          };
          const response = await fetch(CNR_API_ENDPOINT, CNR_FETCH_OPTIONS);
          if (!response.ok) {
              let errBody = null;
              if (response.body) {
                  errBody = await response.text();
              }
              throw new Error(`API update-recipe returned error ${response.status}, body: ${errBody}`);
          }
          const responseData = await response.json();
          return responseData;
      }
      submitButton.addEventListener("click", async function () {
          submittedInput.textContent = "I'm not doing anything yet!";
//          return;
          submittedInput.textContent = outJson;
          serverResponse = await srvUpdateRecipe(outval);
          serverResponseJson = JSON.stringify(serverResponse);
          submissionOutput.textContent = serverResponseJson;
      });
    </script>
  </body>
</html>
